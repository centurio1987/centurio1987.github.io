name: Deploy Astro site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Configure GitHub Packages auth
        # Project .npmrc maps @centurio1987 → GitHub Packages; CI has no global ~/.npmrc,
        # so write the read token here. PACKAGES_READ_TOKEN PAT if set, else the workflow's
        # GITHUB_TOKEN (works when the package is public or grants this repo packages:read).
        # Token into BOTH project .npmrc (bun reads scope+auth here) and ~/.npmrc.
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}" >> ~/.npmrc
      - name: Install dependencies
        # bun's GitHub Packages tarball auth is unreliable on Linux CI (token is valid — curl
        # returns 302 — but bun 401s on the tarball download). Fall back to npm, which handles
        # GitHub Packages _authToken reliably. Build still runs via bunx.
        run: bun install || npm install --no-audit --no-fund
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Check posts for unprocessed markers
        run: bun scripts/check-post-markers.ts
      - name: Check posts for emphasis that never renders
        # Korean particles attach directly to the closing `**`, so `**창(window)**이`
        # is not a valid closing delimiter run under CommonMark and ships as a literal
        # asterisk. Nothing else catches it — build and types stay green.
        run: bun scripts/check-emphasis.ts
      - name: Check posts for blockquotes with collapsed paragraphs
        # A 「읽기 전 약속 N」 preamble that glues 둘째/셋째 into one paragraph renders as
        # a wall of text (vpn-anatomy-6 shipped 564 chars in one). Markdown is valid, so
        # build, types and the emphasis gate all stay green — only this catches it.
        run: bun scripts/check-quote-blocks.ts
      - name: Guard — motion.css in sync with packages (KAN-012 Phase D)
        # src/styles/motion.css is a committed, DETERMINISTIC artifact generated by
        # gen-motion-css.ts from bbangto-ui-core's MOTION_CSS + the authored foundation
        # (bbangtoTonyStyleGuide). CI regenerates it and fails if it drifts from the commit —
        # catching a bumped core/tokens/catalog version or an edited style guide that wasn't
        # re-generated. No LLM → CI-safe (unlike viz/graphify extraction, which stays out of CI).
        run: |
          bun run gen:motion
          git diff --exit-code -- src/styles/motion.css \
            || { echo "::error::src/styles/motion.css is stale — run 'bun run gen:motion' and commit the result."; exit 1; }
      - name: Token gate — ratchet on values that ignore the design tokens (KAN-070)
        # Colors, spacing and radii that skip src/styles/tokens.css ship with build and
        # types fully green — nothing but the eye catches them, which is how 1,300+ of
        # them accumulated (design-concept/UI_CONSISTENCY_AUDIT.md). This is a RATCHET,
        # not a wall: it fails when the count RISES above scripts/tokens-baseline.json.
        # A wall would go red on the first push and, since deploy needs build, would stop
        # the site from shipping until the whole debt is paid. Once the baseline reaches
        # zero this becomes a plain hard fail. Static scan, no Playwright → CI-safe.
        # Do NOT add --warn-only here: the escape hatch exists for local debugging only.
        run: bun run tokens:verify
      - name: Build with Astro
        run: bunx --bun astro build
      - name: Verify rendered output has no stray emphasis markers
        # Ground truth for the source check above: scan the built HTML itself.
        run: bun scripts/check-emphasis.ts --dist
      - name: Upload artifact
        # v4+ excludes dotfiles from the tar by default (v3 included them); dist/ has none
        # today, but keep v3 parity so a future public/.well-known 류 자산이 조용히 빠지지 않게 한다.
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
